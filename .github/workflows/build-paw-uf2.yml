name: Build PAW UF2 Firmware

# Least privilege: byggjobbet läser, skriver bara release-steget.
# id-token (OIDC) används inte av något steg här och är borttaget.
permissions:
  contents: read

# === versionsfästar beroenden (PRO-93-mönster) ============================
# Byggresultatet ska vara reproducerbart: samma commit -> samma firmware.
# Bumpa här, inte i två jobb. Uppdatera vid provat förnyat byggande.
env:
  ARDUINO_CLI_VERSION: v1.5.1
  RP2040_CORE_VERSION: "6.1.1"
  RADIOLIB_VERSION: "7.8.0"
  AESLIB_VERSION: "2.3.6"

on:
  push:
    branches: [main]
    paths:
      - id-kort/paw-main/**
      - plc/edge-challenge-response/**
      - shared/**
      - tests/test_pro52_protocol.py
      - .github/workflows/build-paw-uf2.yml
  pull_request:
    paths:
      - id-kort/paw-main/**
      - plc/edge-challenge-response/**
      - shared/**
      - tests/test_pro52_protocol.py
      - .github/workflows/build-paw-uf2.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions är fästade på commit-SHA, inte på flyttbara taggar (@v4).
      # Taggar kan flyttas efter att en review godkänt dem.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Arduino CLI
        run: |
          curl -fsSL "https://raw.githubusercontent.com/arduino/arduino-cli/${ARDUINO_CLI_VERSION}/install.sh" | sudo BINDIR=/usr/local/bin sh

      - name: Install RP2040 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install "rp2040:rp2040@${RP2040_CORE_VERSION}"

      - name: Install libraries (RadioLib)
        run: arduino-cli lib install "RadioLib@${RADIOLIB_VERSION}"

      - name: Build PAW firmware (UF2)
        run: |
          arduino-cli compile \
            --fqbn rp2040:rp2040:adafruit_feather_rp2350_hstx \
            --build-property build.extra_flags="-DARDUINO_USB_CDC_ONLY" \
            --library "$GITHUB_WORKSPACE/libraries" \
            --output-dir build/paw-main \
            id-kort/paw-main/paw-main.ino
          ls -la build/paw-main/

      - name: Rename UF2 file
        run: |
          # Find the UF2 file and rename it
          UF2_FILE=$(find build/paw-main -name "*.uf2" | head -n 1)
          if [ -n "$UF2_FILE" ]; then
            cp "$UF2_FILE" build/paw-main/paw-main.uf2
            echo "UF2 file created: paw-main.uf2"
          else
            echo "No UF2 file found!"
            # Try to find hex file and convert
            HEX_FILE=$(find build/paw-main -name "*.hex" | head -n 1)
            if [ -n "$HEX_FILE" ]; then
              echo "Found HEX file, attempting conversion..."
              # This would require elf2uf2 tool from pico-sdk
            fi
          fi

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paw-main-uf2
          path: build/paw-main/paw-main.uf2
          compression-level: 0

      - name: Create Release (on main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        # Endast detta steg får skriva innehåll (skapat release).
        permissions:
          contents: write
        with:
          tag_name: paw-latest
          name: PAW Firmware (Latest)
          files: build/paw-main/paw-main.uf2
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-edge-pro52:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Arduino CLI
        run: |
          curl -fsSL "https://raw.githubusercontent.com/arduino/arduino-cli/${ARDUINO_CLI_VERSION}/install.sh" | sudo BINDIR=/usr/local/bin sh

      - name: Install RP2040 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install "rp2040:rp2040@${RP2040_CORE_VERSION}"

      - name: Install libraries (RadioLib, AESLib)
        run: arduino-cli lib install "RadioLib@${RADIOLIB_VERSION}" "AESLib@${AESLIB_VERSION}"

      - name: Build edge challenge-response firmware (UF2)
        run: |
          arduino-cli compile \
            --fqbn rp2040:rp2040:rpipico2 \
            --build-property build.extra_flags="-DEDGE_ALLOW_DEV_KEY=1" \
            --library "$GITHUB_WORKSPACE/shared" \
            --output-dir build/edge-challenge-response \
            plc/edge-challenge-response/edge-challenge-response.ino
          ls -la build/edge-challenge-response/

      - name: Verify build artifact exists
        run: |
          UF2_FILE=$(find build/edge-challenge-response -name "*.uf2" | head -n 1)
          if [ -z "$UF2_FILE" ]; then
            echo "ERROR: No UF2 file produced by edge build"
            exit 1
          fi
          test -f "$UF2_FILE"
          echo "UF2 file created: $UF2_FILE"

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-challenge-response-uf2
          path: build/edge-challenge-response/*.uf2
          compression-level: 0
          if-no-files-found: error
