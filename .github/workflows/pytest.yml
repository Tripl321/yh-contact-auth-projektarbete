name: Pytest Suite

on:
  push:
    branches: [ main ]
    paths:
      - 'tests/**'
      - 'libraries/**'
      - '.github/workflows/pytest.yml'
  pull_request:
    paths:
      - 'tests/**'
      - 'libraries/**'
      - '.github/workflows/pytest.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run test suite
        run: python3 -m pytest tests/ -q
