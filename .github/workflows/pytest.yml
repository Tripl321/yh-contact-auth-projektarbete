name: Pytest Suite
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - tests/**
      - libraries/**
      - .github/workflows/pytest.yml
  pull_request:
    paths:
      - tests/**
      - libraries/**
      - .github/workflows/pytest.yml
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # Actions fästade på commit-SHA, inte flyttbara taggar (@v4).
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Installera projektets deklarerade beroenden, inte bara pytest.
      # tests/ importerar shallot_cli (pyserial, fido2) och cryptography
      # (kommer via fido2). "pip install pytest" räckte inte — sviten
      # kunde inte importeras i CI.
      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run test suite
        run: python3 -m pytest tests/ -q
