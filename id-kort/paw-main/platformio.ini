; PlatformIO Configuration for PAW Main Firmware
; Board: Adafruit Feather RP2350 (RP2350 chip)
; Framework: Arduino (earlephilhower core)
;
; Usage:
;   pio run --target upload    # Compile and upload
;   pio run --target monitor   # Open serial monitor
;   pio run -t clean           # Clean build
;
; NOTE: For Adafruit Feather RP2350, use the following:
;       1. pio platform install https://github.com/earlephilhower/platform-raspberrypi.git
;       2. Or use board: raspberry_pi_pico2 (RP2350 based)
;       3. For full Feather RP2350 support, use custom board definition below

; ============================================================================
; OPTION 1: Use Raspberry Pi Pico 2 (RP2350) - Closest match
; ============================================================================
; Uncomment this section for basic RP2350 support
; [env:pico2]
; platform = raspberrypi
; board = raspberry_pi_pico2
; framework = arduino
; monitor_speed = 115200
; upload_protocol = uf2
; 
; build_flags =
;     -DARDUINO_USB_CDC_ONLY

; ============================================================================
; OPTION 2: Custom board definition for Adafruit Feather RP2350
; ============================================================================
; This is the RECOMMENDED configuration for Feather RP2350

[env:feather_rp2350]
platform = raspberrypi
board = raspberry_pi_pico2  ; Use Pico 2 as base (RP2350)
framework = arduino
monitor_speed = 115200
upload_protocol = uf2

; Custom board configuration for Feather RP2350
board_build.core = earlephilhower
board_build.variant = feather_rp2350
board_build.ldscript = pico2_memmap_default.ld
board_build.f_cpu = 150000000L

; Pin definitions for Feather RP2350
board_build.pins = 
    LED_BUILTIN=25
    SDA=4
    SCL=5
    MOSI=11
    MISO=12
    SCK=10
    SS=13
    RX=1
    TX=0

; Build flags
build_flags =
    -DARDUINO_USB_CDC_ONLY
    -DARDUINO_USB_MODE=1
    -DARDUINO_ARCH_RP2350
    -D__FEATHER_RP2350__

; Required libraries
lib_deps =
    jgromes/RadioLib @ ^7.0.0

; ============================================================================
; OPTION 3: Use earlephilhower's platform directly (BEST for RP2350)
; ============================================================================
; For full RP2350 support, install earlephilhower's platform:
;   pio platform install https://github.com/earlephilhower/platform-raspberrypi.git
; Then use:

; [env:feather_rp2350_earle]
; platform = https://github.com/earlephilhower/platform-raspberrypi.git
; board = feather_rp2350
; framework = arduino
; monitor_speed = 115200
; upload_protocol = uf2
; 
; build_flags =
;     -DARDUINO_USB_CDC_ONLY

; ============================================================================
; Debug Configuration
; ============================================================================

[env:feather_rp2350_debug]
platform = raspberrypi
board = raspberry_pi_pico2
framework = arduino
debug_tool = custom
monitor_speed = 115200

board_build.core = earlephilhower
board_build.variant = feather_rp2350

build_flags =
    -DARDUINO_USB_CDC_ONLY
    -DDEBUG=1

; debug_tool = picoprobe
; debug_port = /dev/cu.usbmodem*
