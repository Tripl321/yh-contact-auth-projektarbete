; PlatformIO Configuration for PAW Main Firmware
; Board: Adafruit Feather RP2350
; Framework: Arduino (earlephilhower core)
;
; Usage:
;   pio run --target upload    # Compile and upload
;   pio run --target monitor   # Open serial monitor
;   pio run -t clean           # Clean build

[env:feather_rp2350]
platform = raspberrypi
board = feather_rp2350
framework = arduino
monitor_speed = 115200
upload_protocol = uf2

; Required libraries
lib_deps =
    ; Uncomment when you have RadioLib installed for real LoRa
    ; jgromes/RadioLib @ ^6.0.0

; Build flags
build_flags =
    -DARDUINO_USB_CDC_ONLY
    -DARDUINO_USB_MODE=1

; For debugging
; debug_tool = custom
; debug_port = /dev/cu.usbmodem*
; debug_server = 
;   openocd
;   -f interface/cmsis-dap.cfg
;   -f target/rp2040.cfg
;   -c adapter driver cmsis-dap

[env:feather_rp2350_debug]
platform = raspberrypi
board = feather_rp2350
framework = arduino
debug_tool = custom
monitor_speed = 115200

; Alternative: Pico Debug Probe
; debug_tool = picoprobe
; debug_port = /dev/cu.usbmodem*
